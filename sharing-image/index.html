<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="A title block for andersdrage.com, ready to capture at 1200 × 628 pixels." />
    <link rel="icon" href="/images/dragonmark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/sharing-image.css" />
    <script type="module" src="/src/sharing-image.js"></script>
    <title>Sharing image — Anders Drage</title>
  </head>
  <body>
    <main class="sharing-canvas" aria-label="Sharing image, 1200 by 628 pixels">
      <div class="sharing-title-block" aria-label="andersdrage.com project details">
        <dl class="sharing-row sharing-row--header">
          <div class="sharing-cell"><dt>Project</dt><dd contenteditable="plaintext-only" role="textbox" aria-label="Project" data-field="project">andersdrage.com</dd></div>
          <div class="sharing-cell"><dt>Year</dt><dd contenteditable="plaintext-only" role="textbox" aria-label="Year" data-field="year">2026</dd></div>
          <div class="sharing-cell"><dt>Version</dt><dd contenteditable="plaintext-only" role="textbox" aria-label="Version" data-field="version">39</dd></div>
          <div class="sharing-signature" aria-hidden="true"><img src="/images/dragonmark.svg" alt="" width="77" height="57" /></div>
        </dl>
        <dl class="sharing-row sharing-row--halves">
          <div class="sharing-cell"><dt>Concept</dt><dd contenteditable="plaintext-only" role="textbox" aria-label="Concept" data-field="concept">fluidity</dd></div>
          <div class="sharing-cell"><dt>Tolerance</dt><dd contenteditable="plaintext-only" role="textbox" aria-label="Tolerance" data-field="tolerance">±1 px</dd></div>
        </dl>
        <dl class="sharing-row sharing-row--thirds">
          <div class="sharing-cell" title="Approximate deployed build including all tracked media, measured 9 September 2026. Not the initial page download."><dt>Weight · full build</dt><dd contenteditable="plaintext-only" role="textbox" aria-label="Weight, full build" data-field="weight">~160 MB</dd></div>
          <div class="sharing-cell" title="Median load-event time from three fresh desktop browser sessions on 9 September 2026, without throttling. Varies by connection and device."><dt>Load · desktop sample</dt><dd contenteditable="plaintext-only" role="textbox" aria-label="Loading time, desktop sample" data-field="load">1.4 s</dd></div>
          <div class="sharing-cell"><dt>Made in</dt><dd contenteditable="plaintext-only" role="textbox" aria-label="Made in" data-field="origin">Norway</dd></div>
        </dl>
      </div>
    </main>
  </body>
</html>
